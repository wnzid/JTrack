{% extends "base.html" %}
{% block title %}Workspace — JTrack{% endblock %}
{% block body %}
<main id="main-content" class="shell welcome-page">
  <header class="page-intro page-intro--split">
    <div><p class="eyebrow">{{ role }} workspace</p><h1>Choose the question you need to answer.</h1></div>
    <a class="button" href="{{ dashboard_url }}">Open overview</a>
  </header>
  <div class="report-directory">
    {% for report in reports %}
      <a href="{{ report.page_path }}" class="directory-row">
        <span class="mono">0{{ loop.index }}</span>
        <span><strong>{{ report.title }}</strong><small>{{ report.description }}</small></span>
        <span aria-hidden="true">↗</span>
      </a>
    {% endfor %}
  </div>
</main>
{% endblock %}
