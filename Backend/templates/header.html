<header class="site-header">
  <div class="shell site-header__inner">
    <a class="wordmark" href="{{ url_for('pages.welcome') if session.get('email') else url_for('pages.landing') }}" aria-label="JTrack home">
      <span class="wordmark__mark" aria-hidden="true">JT</span>
      <span>JTrack</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span><span class="sr-only">Toggle navigation</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      {% if session.get('email') %}
        <a href="{{ url_for('pages.dashboard') if session.get('role') == 'Manager' else url_for('pages.leader_dashboard') }}" class="{{ 'is-active' if request.endpoint in ['pages.dashboard', 'pages.managerial_dashboard', 'pages.leader_dashboard'] else '' }}">Overview</a>
        <a href="{{ url_for('pages.custom_dashboard') }}" class="{{ 'is-active' if request.endpoint == 'pages.custom_dashboard' else '' }}">Build a view</a>
        <a href="{{ url_for('pages.about') }}" class="{{ 'is-active' if request.endpoint == 'pages.about' else '' }}">About</a>
        <span class="identity"><span class="identity__role">{{ session.get('role') }}</span>{{ session.get('email') }}</span>
        <form action="{{ url_for('auth.logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="text-button" type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="{{ url_for('pages.landing') }}" class="{{ 'is-active' if request.endpoint == 'pages.landing' else '' }}">Product</a>
        <a href="{{ url_for('pages.about') }}" class="{{ 'is-active' if request.endpoint == 'pages.about' else '' }}">About</a>
        <a href="{{ url_for('auth.login') }}">Sign in</a>
        <a class="button button--small" href="{{ url_for('auth.register') }}">Create account</a>
      {% endif %}
    </nav>
  </div>
</header>
